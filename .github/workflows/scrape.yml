name: Atualizar Nível dos Reservatórios

on:
  schedule:
    # Todo dia às 10h UTC (7h Brasília)
    - cron: '0 10 * * *'
  workflow_dispatch: # permite disparar manualmente

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Executar scraper
        run: python scraper/scrape.py

      - name: Verificar mudanças
        id: check_changes
        run: |
          git diff --quiet data/reservatorios.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit e push dos dados atualizados
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reservatorios.json
          git commit -m "Atualização automática dos reservatórios — $(date '+%Y-%m-%d')"
          git push

      - name: Sem alterações
        if: steps.check_changes.outputs.changed != 'true'
        run: echo "Nenhuma alteração detectada nos dados."

      # Alerta de defasagem: abre (ou comenta) uma issue quando algum sistema para de atualizar
      # e fecha a issue automaticamente quando tudo volta ao normal.
      - name: Verificar frescor dos dados
        id: frescor
        run: python scraper/check_staleness.py

      - name: Abrir/atualizar issue de defasagem
        if: steps.frescor.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh issue list --label dados-defasados --state open --json number -q '.[0].number')
          if [ -z "$N" ]; then
            gh label create dados-defasados --color d93f0b --force >/dev/null
            gh issue create --title "Dados de reservatórios defasados" --label dados-defasados --body-file /tmp/relatorio_frescor.md
          else
            gh issue comment "$N" --body-file /tmp/relatorio_frescor.md
          fi

      - name: Fechar issue de defasagem
        if: steps.frescor.outputs.stale == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for N in $(gh issue list --label dados-defasados --state open --json number -q '.[].number'); do
            gh issue close "$N" --comment "Todos os sistemas voltaram a atualizar."
          done
