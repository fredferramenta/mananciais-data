name: Atualizar Nível dos Reservatórios

on:
  schedule:
    # Todo dia às 10h UTC (7h Brasília)
    - cron: '0 10 * * *'
  workflow_dispatch: # permite disparar manualmente

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          pip install requests playwright beautifulsoup4
          playwright install chromium --with-deps

      - name: Executar scraper
        run: python scraper/scrape.py

      - name: Verificar mudanças
        id: check_changes
        run: |
          git diff --quiet data/reservatorios.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit e push dos dados atualizados
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reservatorios.json
          git commit -m "Atualização automática dos reservatórios — $(date '+%Y-%m-%d')"
          git push

      - name: Sem alterações
        if: steps.check_changes.outputs.changed != 'true'
        run: echo "Nenhuma alteração detectada nos dados."
